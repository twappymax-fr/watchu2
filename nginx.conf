events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name torvu.org www.torvu.org;

        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name torvu.org www.torvu.org;
	client_max_body_size 64M;
        ssl_certificate /etc/letsencrypt/live/torvu.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torvu.org/privkey.pem;

        location /static/ {
            alias /static/;
            expires 7d;
        }

        location /media/ {
            alias /app/media/;
        }

        location / {
            proxy_pass http://web:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
